apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-html-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-html-app
  template:
    metadata:
      labels:
        app: my-html-app
    spec:
      containers:
      - name: nginx
        image: docker.io/nesmashny/my-html-app:v2.0
        ports:
        - containerPort: 80