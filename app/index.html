<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>My CI/CD App</title>
    <style>
        body { font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #0f172a; color: #f8fafc; margin: 0; }
        .card { text-align: center; padding: 2.5rem; border-radius: 16px; background-color: #1e293b; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5); border: 1px solid #334155; }
        h1 { color: #38bdf8; margin-bottom: 0.5rem; }
        p { color: #94a3b8; }
        .tag { display: inline-block; padding: 0.25rem 0.75rem; border-radius: 9999px; background-color: #0369a1; color: #e0f2fe; font-weight: bold; font-size: 0.875rem; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Привет из Kubernetes! 🚀</h1>
        <p>Наш CI/CD пайплайн успешно работает.</p>
        <div class="tag">Версия: v1.0</div>
    </div>
</body>
</html>
